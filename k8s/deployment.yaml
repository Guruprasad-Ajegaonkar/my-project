apiVersion: apps/v1
kind: Deployment

metadata:
  name: springboot-app
  namespace: springboot

spec:
  replicas: 2

  selector:
    matchLabels:
      app: springboot

  template:

    metadata:
      labels:
        app: springboot

    spec:

      containers:

      - name: springboot

        image: myacr.azurecr.io/springboot-app:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"

          limits:
            memory: "512Mi"
            cpu: "500m"